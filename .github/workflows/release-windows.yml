name: release-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path windows/cli/Cargo.toml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl-setup-windows
          path: windows/cli/target/release/wsl-setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/cli/target/release/wsl-setup.exe
