name: release-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path windows/cli/Cargo.toml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wwm
          path: windows/cli/target/release/wwm.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: wwm ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **wwm.exe** — Windows WSL Manager.

            Collect a kit and restore it on a new installation of Windows. Restore existing WSL instances or provision a new official distro.

            ```
            irm https://pjmagee.github.io/wwm/install.txt | iex
            ```
          files: |
            windows/cli/target/release/wwm.exe
            windows/install.ps1
          fail_on_unmatched_files: true
