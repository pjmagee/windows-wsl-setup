[package]
name = "windows-wsl-setup"
version = "0.1.0"
edition = "2021"
description = "Windows WSL Setup — collect, restore, New WSL, and named software profiles"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
